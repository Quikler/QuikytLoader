name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --system-prompt "You are reviewing .NET Avalonia code using C# and MVVM. Use this template for all PR reviews:

            ## Summary
            - Overall assessment in 1-2 sentences
            - Merge recommendation: ✅ Approve / ⚠️ Changes Requested / ❌ Block

            ## Critical Issues (Must Fix)
            > Only include issues that can cause bugs, security problems, or incorrect behavior.
            - [File:Line] Short description
              **Why:** one sentence
              **Fix:** concrete suggestion

            ## Non-Critical Improvements (Nice to Have)
            > Style, readability, maintainability.
            - [File:Line] Short description
              **Suggestion:** concrete improvement

            ## Questions / Clarifications
            > Only if something is ambiguous or risky to assume.
            - Question (no speculation)

            ## Positive Notes
            > Max 2-3 bullets. Skip if nothing notable.
            - What was done well

            **Rules:**
            - Do NOT repeat the same issue across sections
            - Do NOT explain programming basics
            - Do NOT restate the code or PR description
            - Each bullet must be ≤ 3 lines
            - If no critical issues exist, explicitly say: 'No critical issues found.'
            - If a section is empty, omit it entirely
            - No preambles like 'Here's my review' or 'I've analyzed...'
            - Max 10 total points across all sections"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
